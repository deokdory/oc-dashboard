<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OC Dashboard</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --card-border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --active: #238636;
      --recent: #d29922;
      --idle: #484f58;
      --accent: #58a6ff;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      display: grid;
      grid-template-columns: 240px 1fr;
      grid-template-rows: auto auto 1fr auto;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* header */
    header {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--card-border);
    }

    .connection-status { font-size: 13px; font-weight: 500; }
    .connection-status.connected { color: var(--active); }
    .connection-status.disconnected { color: #f85149; }

    /* sidebar */
    .sidebar {
      grid-row: 3;
      grid-column: 1;
      overflow-y: auto;
      background: var(--card);
      border-right: 1px solid var(--card-border);
      padding: 8px 0;
    }

    .sidebar-section-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 12px 16px 4px;
    }

    .sidebar-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-muted);
      border-left: 3px solid transparent;
      transition: background 0.15s, color 0.15s;
      user-select: none;
    }

    .sidebar-item:hover {
      background: #21262d;
      color: var(--text);
    }

    .sidebar-item.active {
      border-left-color: var(--accent);
      color: var(--text);
      background: #1c2128;
    }

    .sidebar-item-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 160px;
    }

    .sidebar-badge {
      font-size: 10px;
      background: #21262d;
      border-radius: 10px;
      padding: 1px 6px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    /* summary-bar */
    .summary-bar {
      grid-column: 1 / -1;
      display: flex;
      gap: 12px;
      padding: 12px 16px;
      background: var(--bg);
      border-bottom: 1px solid var(--card-border);
      flex-wrap: wrap;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 16px;
      min-width: 100px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    /* main-content */
    .main-content {
      grid-row: 3;
      grid-column: 2;
      overflow-y: auto;
      padding: 16px;
      display: grid;
      gap: 12px;
      align-content: start;
    }

    /* process-panel */
    .process-panel {
      grid-row: 4;
      grid-column: 1 / -1;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 0;
      opacity: 0.6;
      font-size: 11px;
    }

    .process-panel-inner {
      display: flex;
      flex-wrap: wrap;
      overflow-x: auto;
    }

    .process-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #21262d;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      margin: 4px;
      font-family: monospace;
    }

    /* project-list */
    .project-list {
      display: grid;
      gap: 12px;
    }

    .project-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
    }

    .project-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      cursor: pointer;
      user-select: none;
    }

    .project-header:hover { background: #21262d; }

    .project-name {
      font-weight: 600;
      font-size: 14px;
    }

    .session-count {
      color: var(--text-muted);
      font-size: 12px;
    }

    .session-list {
      border-top: 1px solid var(--card-border);
    }

    .session-list.collapsed { display: none; }

    /* session-card */
    .session-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 8px;
    }

    .session-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .session-title {
      font-size: 13px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 60ch;
    }

    /* status-badge */
    .status-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .status-badge.active {
      background: #0f2c18;
      color: var(--active);
      border: 1px solid var(--active);
    }

    .status-badge.recent {
      background: #2d2000;
      color: var(--recent);
      border: 1px solid var(--recent);
    }

    .status-badge.idle {
      background: #1c1f24;
      color: var(--idle);
      border: 1px solid var(--idle);
    }

    /* todo-progress */
    .todo-progress { margin: 4px 0; }

    .progress-bar {
      height: 3px;
      background: #21262d;
      border-radius: 2px;
      overflow: hidden;
      margin: 3px 0;
    }

    .progress-fill {
      height: 100%;
      background: var(--active);
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    .progress-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* message-preview */
    .message-preview {
      font-size: 11px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 4px;
    }

    .message-role { font-weight: 600; }

    /* empty states */
    .empty-state {
      padding: 12px 16px;
      color: var(--text-muted);
      font-size: 12px;
      font-style: italic;
    }

    /* notification banner */
    .notification-banner {
      background: #1c2128;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .notification-banner button {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 4px;
      padding: 4px 12px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .notification-banner button:hover { opacity: 0.85; }

    /* section label */
    .section-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* chevron */
    .chevron {
      font-size: 10px;
      color: var(--text-muted);
      margin-left: 6px;
      transition: transform 0.2s;
    }

    .project-header[data-expanded="true"] .chevron {
      transform: rotate(90deg);
    }

    /* sub-agent badge */
    .sub-agent-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #1c2128;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 1px 8px;
      font-size: 10px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      margin-top: 4px;
      transition: background 0.15s;
    }
    .sub-agent-badge:hover { background: #21262d; color: var(--text); }

    /* sub-agent list */
    .sub-agent-list {
      margin: 6px 0 0 0;
      padding: 6px 0 0 12px;
      border-left: 2px solid #30363d;
    }
    .sub-agent-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 0;
      font-size: 11px;
      color: var(--text-muted);
    }
    .sub-agent-item .agent-name {
      font-size: 10px;
      color: var(--accent);
      font-weight: 600;
      flex-shrink: 0;
    }
    .sub-agent-item .agent-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sub-agent-loading {
      font-size: 11px;
      color: var(--text-muted);
      font-style: italic;
      margin-top: 4px;
    }

    /* agent-label — above session title */
    .agent-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 3px;
    }

    /* main content header (project name + count) */
    .main-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      margin-top: 4px;
    }

    .main-title {
      font-size: 15px;
      font-weight: 600;
    }

    .main-count {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* git-diff */
    .git-diff {
      font-size: 11px;
      margin-top: 4px;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .git-diff-add {
      color: var(--active);
      font-weight: 600;
    }

    .git-diff-del {
      color: #f85149;
      font-weight: 600;
    }

    .git-diff-files {
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <h1 style="margin:0;font-size:16px;font-weight:600">⚡ OC Dashboard</h1>
    <span id="conn-status" class="connection-status disconnected">● Disconnected</span>
  </header>

  <section class="summary-bar" id="summary-panel">
    <div class="stat-card">
      <span class="stat-value" id="stat-active">—</span>
      <span class="stat-label">Active</span>
    </div>
    <div class="stat-card">
      <span class="stat-value" id="stat-recent">—</span>
      <span class="stat-label">Recent</span>
    </div>
    <div class="stat-card">
      <span class="stat-value" id="stat-idle">—</span>
      <span class="stat-label">Idle</span>
    </div>
    <div class="stat-card">
      <span class="stat-value" id="stat-token-in">—</span>
      <span class="stat-label">↑ Input Tokens</span>
    </div>
    <div class="stat-card">
      <span class="stat-value" id="stat-token-out">—</span>
      <span class="stat-label">↓ Output Tokens</span>
    </div>
  </section>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section-label">Projects</div>
    <div id="sidebar-list">
      <div class="sidebar-item active" data-project-id="all">
        <span class="sidebar-item-name">All Projects</span>
      </div>
    </div>
  </aside>

  <section class="main-content" id="main-content">
    <div id="notif-banner" class="notification-banner" style="display:none">
      <span>Enable notifications to get alerted when sessions complete</span>
      <button id="notif-btn">Enable</button>
    </div>
    <div id="error-banner" style="display:none; padding:8px 16px; background:#2d1b1b; color:#f85149; border-radius:8px; margin-bottom:12px; font-size:13px;"></div>
    <div class="project-list" id="projects-container">
      <div class="empty-state">Loading...</div>
    </div>
  </section>

  <section class="process-panel">
    <div class="section-label">Running Processes</div>
    <div class="process-panel-inner" id="process-list">
      <span class="empty-state">No running processes</span>
    </div>
  </section>

  <script>
    // SSE 연결
    const es = new EventSource('/events');
    const connStatus = document.getElementById('conn-status');

    es.onopen = () => {
      connStatus.textContent = '● Connected';
      connStatus.className = 'connection-status connected';
    };

    es.onerror = () => {
      connStatus.textContent = '● Disconnected';
      connStatus.className = 'connection-status disconnected';
    };

    es.onmessage = (e) => {
      try {
        const data = JSON.parse(e.data);
        if (data.error) { showError(data.error); return; }
        render(data);
      } catch (err) {
        showError('Failed to parse server data');
      }
    };

    // 알림 권한 + 중복 방지
    const notifiedSessions = new Set();
    const expandedSubAgents = new Set(); // sessionId — expanded sub-agent list
    const subAgentCache = new Map();     // sessionId -> SubAgentSession[]
    let lastData = null; // 최신 SSE 데이터 보관 (toggleSubAgents에서 즉시 재렌더용)
    let selectedProjectId = 'all'; // 'all' 또는 특정 projectId

    function formatNumber(n) {
      if (n == null || isNaN(n)) return '0';
      if (n >= 1_000_000) return (n / 1_000_000).toFixed(1).replace(/\.0$/, '') + 'M';
      if (n >= 1_000) return Math.round(n / 1_000) + 'K';
      return String(n);
    }

    function renderSidebar(data) {
      const list = document.getElementById('sidebar-list');
      if (!list) return;
      const projects = data.projects || [];
      const sessions = data.sessions || [];

      // selectedProjectId가 더 이상 존재하지 않으면 'all'로 폴백
      if (selectedProjectId !== 'all' && !projects.find(p => p.id === selectedProjectId)) {
        selectedProjectId = 'all';
      }

      const allActive = sessions.filter(s => s.status === 'ACTIVE').length;

      list.innerHTML = `
        <div class="sidebar-item ${selectedProjectId === 'all' ? 'active' : ''}"
             data-project-id="all"
             onclick="selectProject('all')">
          <span class="sidebar-item-name">All Projects</span>
          ${allActive > 0 ? `<span class="sidebar-badge">${allActive}</span>` : ''}
        </div>
        ${projects.map(proj => {
          const projSessions = sessions.filter(s => s.projectId === proj.id);
          const activeCount = projSessions.filter(s => s.status === 'ACTIVE').length;
          const isSelected = selectedProjectId === proj.id;
          return `
            <div class="sidebar-item ${isSelected ? 'active' : ''}"
                 data-project-id="${escHtml(proj.id)}"
                 onclick="selectProject('${escHtml(proj.id)}')">
              <span class="sidebar-item-name">${escHtml(proj.displayName)}</span>
              ${activeCount > 0 ? `<span class="sidebar-badge">${activeCount}</span>` : ''}
            </div>
          `;
        }).join('')}
      `;
    }

    function selectProject(projectId) {
      selectedProjectId = projectId;
      if (lastData) render(lastData);
    }

    function renderSummaryPanel(data) {
      const sessions = data.sessions || [];
      const tokenSummary = data.tokenSummary || { totalInput: 0, totalOutput: 0 };

      const activeCount = sessions.filter(s => s.status === 'ACTIVE').length;
      const recentCount = sessions.filter(s => s.status === 'RECENT').length;
      const idleCount = sessions.filter(s => s.status === 'IDLE').length;

      const statActive = document.getElementById('stat-active');
      const statRecent = document.getElementById('stat-recent');
      const statIdle = document.getElementById('stat-idle');
      const statTokenIn = document.getElementById('stat-token-in');
      const statTokenOut = document.getElementById('stat-token-out');

      if (statActive) statActive.textContent = String(activeCount);
      if (statRecent) statRecent.textContent = String(recentCount);
      if (statIdle) statIdle.textContent = String(idleCount);
      if (statTokenIn) statTokenIn.textContent = formatNumber(tokenSummary.totalInput);
      if (statTokenOut) statTokenOut.textContent = formatNumber(tokenSummary.totalOutput);
    }

    function checkNotifications(data) {}

    function relativeTime(ms) {
      if (!ms) return '';
      const delta = Date.now() - ms;
      if (delta < 0) return 'just now';
      const sec = Math.floor(delta / 1000);
      if (sec < 60) return sec + 's ago';
      const min = Math.floor(sec / 60);
      if (min < 60) return min + 'm ago';
      const hr = Math.floor(min / 60);
      if (hr < 24) return hr + 'h ago';
      const d = Math.floor(hr / 24);
      return d + 'd ago';
    }

    function render(data) {
      lastData = data;
      renderSidebar(data);
      renderSummaryPanel(data);
      renderProcesses(data.processes || []);
      renderProjects(data);
      const sessions = data.sessions || [];
      for (const session of sessions) {
        if (expandedSubAgents.has(session.id) && !subAgentCache.has(session.id)) {
          fetchSubAgents(session.id);
        }
      }
    }

    function renderProcesses(processes) {
      const panel = document.getElementById('process-list');
      if (!processes.length) {
        panel.innerHTML = '<span class="empty-state">No running processes</span>';
        return;
      }
      panel.innerHTML = processes.map(p => `
        <span class="process-pill">
          <span style="color:var(--active)">●</span>
          PID ${p.pid} &nbsp; CPU ${p.cpu}% &nbsp; MEM ${p.mem}% &nbsp; ${escHtml(p.elapsed)}
          <span style="color:var(--text-muted)">${escHtml(p.cwd.split('/').pop() || '/')}</span>
        </span>
      `).join('');
    }

     function renderProjects(data) {
       const container = document.getElementById('projects-container');
      const projects = data.projects || [];
      const sessions = data.sessions || [];
      const todos = data.todos || {};
      const messages = data.messages || {};

      if (selectedProjectId === 'all') {
        const allSessions = [...sessions].sort((a, b) => (b.timeUpdated || 0) - (a.timeUpdated || 0));
        if (allSessions.length === 0) {
          container.innerHTML = '<div class="empty-state">No sessions found</div>';
          return;
        }
        container.innerHTML = allSessions.map(s => renderSessionCard(s, todos[s.id] || [], messages[s.id])).join('');
        return;
      }

      const filteredProjects = projects.filter(p => p.id === selectedProjectId);

      if (!filteredProjects.length) {
        container.innerHTML = '<div class="empty-state">No projects found</div>';
        return;
      }

      container.innerHTML = filteredProjects.map(proj => {
        const projSessions = sessions.filter(s => s.projectId === proj.id);
        const sessionCount = projSessions.length;
        const sessionHtml = sessionCount === 0
          ? '<div class="empty-state">No active sessions</div>'
          : projSessions.map(s => renderSessionCard(s, todos[s.id] || [], messages[s.id])).join('');
        return `
          <div class="main-header">
            <span class="main-title">${escHtml(proj.displayName)}</span>
            <span class="main-count">${sessionCount} session${sessionCount !== 1 ? 's' : ''}</span>
          </div>
          ${sessionHtml}
        `;
      }).join('');
    }

    function renderSessionCard(session, todos, msg) {
      const statusClass = session.status.toLowerCase();
      const todoHtml = todos.length > 0 ? renderTodoProgress(todos) : '';

      // 에이전트 라벨 (제목 위, agent-tag 대체)
      const agentLabelHtml = (msg && msg.agent)
        ? `<div class="agent-label">${escHtml(msg.agent)}</div>`
        : '';

      let msgHtml = '';
      if (msg) {
        msgHtml = `<div class="message-preview"><span class="message-role">${escHtml(msg.role)}: </span>${escHtml(msg.textPreview || '')}</div>`;
      } else if (msg === null) {
        msgHtml = '<div class="message-preview">No messages yet</div>';
      }
      // msg === undefined → IDLE session, data not fetched — show nothing

      const timeHtml = session.timeUpdated
        ? `<span style="color:var(--text-muted);font-size:11px;margin-right:8px">${relativeTime(session.timeUpdated)}</span>`
        : '';

      // git diff (null-safe: 모두 null이거나 0이면 미렌더링)
      let gitDiffHtml = '';
      const adds = session.summaryAdditions;
      const dels = session.summaryDeletions;
      const files = session.summaryFiles;
      if (adds != null || dels != null || files != null) {
        const hasContent = (adds || 0) > 0 || (dels || 0) > 0 || (files || 0) > 0;
        if (hasContent) {
          gitDiffHtml = `
            <div class="git-diff">
              <span class="git-diff-add">+${adds || 0}</span>
              <span class="git-diff-del">-${dels || 0}</span>
              <span class="git-diff-files">· ${files || 0} file${(files || 0) !== 1 ? 's' : ''}</span>
            </div>
          `;
        }
      }

      // sub-agent badge (ACTIVE만, 0이면 숨김)
      let badgeHtml = '';
      if (session.subAgentCount > 0) {
        const isExpanded = expandedSubAgents.has(session.id);
        const chevron = isExpanded ? '▾' : '▸';
        badgeHtml = `<span class="sub-agent-badge" onclick="toggleSubAgents('${escHtml(session.id)}')" data-session-id="${escHtml(session.id)}">${session.subAgentCount} active sub-sessions ${chevron}</span>`;
      }

      // sub-agent list (from cache or trigger fetch)
      let subAgentListHtml = '';
      if (expandedSubAgents.has(session.id)) {
        const cached = subAgentCache.get(session.id);
        if (cached) {
          subAgentListHtml = renderSubAgentList(cached);
        } else {
          subAgentListHtml = '<div class="sub-agent-loading">Loading...</div>';
          // 캐시 없으면 비동기 fetch 트리거
          fetchSubAgents(session.id);
        }
      }

      return `
        <div class="session-card">
          ${agentLabelHtml}
          <div class="session-header">
            <span class="session-title">${escHtml(session.title)}</span>
            <span style="display:flex;align-items:center">
              ${timeHtml}
              <span class="status-badge ${statusClass}">${escHtml(session.status)}</span>
            </span>
          </div>
          ${todoHtml}
          ${gitDiffHtml}
          ${msgHtml}
          ${badgeHtml}
          ${subAgentListHtml}
        </div>
      `;
    }

    function renderTodoProgress(todos) {
      const total = todos.length;
      const done = todos.filter(t => t.status === 'completed').length;
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;
      return `
        <div class="todo-progress">
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
          <span class="progress-label">${done}/${total} tasks</span>
        </div>
      `;
    }

    function renderSubAgentList(subAgents) {
      if (!subAgents.length) return '<div class="sub-agent-loading">No sub-agents found</div>';
      return `<div class="sub-agent-list">${subAgents.map(a => `
        <div class="sub-agent-item">
          ${a.agentName ? `<span class="agent-name">@${escHtml(a.agentName)}</span>` : ''}
          <span class="agent-title">${escHtml(a.title || 'Untitled')}</span>
          <span class="status-badge ${(a.status||'IDLE').toLowerCase()}" style="font-size:9px;padding:1px 4px;">${escHtml(a.status||'IDLE')}</span>
        </div>
      `).join('')}</div>`;
    }

    async function fetchSubAgents(sessionId) {
      try {
        const res = await fetch(`/sessions/${sessionId}/subagents`);
        if (!res.ok) return;
        const data = await res.json();
        subAgentCache.set(sessionId, data);
        // DOM 업데이트: 해당 세션 카드의 서브에이전트 목록만 업데이트
        const badge = document.querySelector(`.sub-agent-badge[data-session-id="${CSS.escape(sessionId)}"]`);
        if (badge) {
          const card = badge.closest('.session-card');
          if (card) {
            let listEl = card.querySelector('.sub-agent-list, .sub-agent-loading');
            if (listEl) {
              listEl.outerHTML = renderSubAgentList(data);
            } else {
              card.insertAdjacentHTML('beforeend', renderSubAgentList(data));
            }
          }
        }
      } catch (e) {
        console.warn('[dashboard] fetchSubAgents error:', e);
      }
    }

    function toggleSubAgents(sessionId) {
      if (expandedSubAgents.has(sessionId)) {
        expandedSubAgents.delete(sessionId);
        subAgentCache.delete(sessionId); // 접으면 캐시 무효화 (다음 열기 시 fresh)
      } else {
        expandedSubAgents.add(sessionId);
      }
      // SSE 갱신을 기다리지 않고 즉시 re-render 트리거
      if (lastData) render(lastData);
    }

    function escHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showError(msg) {
      const banner = document.getElementById('error-banner');
      banner.textContent = `⚠️ ${msg}`;
      banner.style.display = 'block';
    }

     // Notifications disabled
  </script>

</body>
</html>
