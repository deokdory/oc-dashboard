<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>OC Dashboard</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --card-border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --active: #58a6ff;
      --recent: #3fb950;
      --idle: #484f58;
      --accent: #58a6ff;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      display: grid;
      grid-template-columns: 240px 1fr;
      grid-template-rows: auto 1fr auto;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* header */
    header {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px;
      background: var(--card);
      border-bottom: 1px solid var(--card-border);
    }

    .connection-status { font-size: 13px; font-weight: 500; }
    .connection-status.connected { color: var(--active); }
    .connection-status.disconnected { color: #f85149; }

    /* sidebar */
    .sidebar {
      grid-row: 2;
      grid-column: 1;
      overflow-y: auto;
      background: var(--card);
      border-right: 1px solid var(--card-border);
      padding: 8px 0;
    }

    .sidebar-section-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 12px 16px 4px;
    }

    .sidebar-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-muted);
      border-left: 3px solid transparent;
      transition: background 0.15s, color 0.15s;
      user-select: none;
    }

    .sidebar-item:hover {
      background: #21262d;
      color: var(--text);
    }

    .sidebar-item.active {
      background: rgba(88, 166, 255, 0.08);
      color: #e6edf3;
    }
    .sidebar-item.archived {
      opacity: 0.5;
    }
    .sidebar-divider {
      font-size: 11px;
      color: var(--text-muted);
      padding: 10px 16px 4px;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .sidebar-divider:hover { color: var(--text); }

    .sidebar-item-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 160px;
    }

    .sidebar-badges {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .sidebar-badge {
      font-size: 10px;
      border-radius: 10px;
      padding: 1px 6px;
      flex-shrink: 0;
    }
    .sidebar-badge.badge-active {
      background: rgba(88, 166, 255, 0.15);
      color: var(--active);
    }
    .sidebar-badge.badge-complete {
      background: rgba(63, 185, 80, 0.15);
      color: var(--recent);
    }
    .sidebar-badge.badge-waiting {
      background: rgba(240, 160, 48, 0.15);
      color: #f0a030;
    }
    .sidebar-badge.badge-delegating {
      background: rgba(180, 142, 255, 0.15);
      color: #b48eff;
    }
    .sidebar-separator {
      height: 1px;
      background: var(--card-border);
      margin: 6px 16px;
    }

    /* summary-bar */
    .summary-bar {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    .summary-row {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 14px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-value {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    /* main-content */
    .main-content {
      grid-row: 2;
      grid-column: 2;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px;
      display: grid;
      gap: 12px;
      align-content: start;
      min-width: 0;
    }

    /* process-panel */
    .process-panel {
      grid-row: 3;
      grid-column: 1 / -1;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 12px;
      padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      margin-bottom: 0;
      opacity: 0.6;
      font-size: 11px;
    }

    .process-panel-inner {
      display: flex;
      flex-wrap: wrap;
      overflow-x: auto;
    }

    .process-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #21262d;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      margin: 4px;
      font-family: monospace;
    }

    /* project-list */
    .project-list {
      display: grid;
      gap: 12px;
    }

    .project-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
    }

    .project-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      cursor: pointer;
      user-select: none;
    }

    .project-header:hover { background: #21262d; }

    .project-name {
      font-weight: 600;
      font-size: 14px;
    }

    .session-count {
      color: var(--text-muted);
      font-size: 12px;
    }

    .session-list {
      border-top: 1px solid var(--card-border);
    }

    .session-list.collapsed { display: none; }

    /* session-card */
    .session-card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 12px;
      min-width: 0;
      overflow: hidden;
    }
    .session-card-layout {
      display: flex;
      align-items: stretch;
    }
    .session-card-content {
      flex: 1;
      min-width: 0;
    }
    .session-card-aside {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      margin-left: 16px;
    }
    .session-card-aside-top {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .session-card.card-active {
      border-color: rgba(88, 166, 255, 0.4);
      background: linear-gradient(135deg, #0d1f33 0%, var(--card) 100%);
    }
    .session-card.card-recent {
      border-color: rgba(63, 185, 80, 0.35);
      background: linear-gradient(135deg, #0c1f12 0%, var(--card) 100%);
    }

    

    .session-title {
      font-size: 16px;
      font-weight: 600;
      color: #e6edf3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* status-badge */
    .status-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .status-badge.active {
      background: #122d4f;
      color: var(--active);
      border: 1px solid var(--active);
    }

    .status-badge.recent {
      background: #0f2c18;
      color: var(--recent);
      border: 1px solid var(--recent);
    }

    .status-badge.idle {
      background: #1c1f24;
      color: var(--idle);
      border: 1px solid var(--idle);
    }

    .status-badge.waiting {
      background: #2d1f00;
      color: #f0a030;
      border: 1px solid #f0a030;
    }

    .session-card.card-waiting {
      border-color: rgba(240, 160, 48, 0.4);
      background: linear-gradient(135deg, #1f1500 0%, var(--card) 100%);
    }

    .status-badge.delegating {
      background: #1f1030;
      color: #b48eff;
      border: 1px solid #b48eff;
    }

    .session-card.card-delegating {
      border-color: rgba(180, 142, 255, 0.4);
      background: linear-gradient(135deg, #140d20 0%, var(--card) 100%);
    }

    /* circular progress */
    .progress-ring-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
    }
    .progress-ring { transform: rotate(-90deg); transform-origin: center; }
    .progress-ring-bg {
      fill: none;
      stroke: #30363d;
      stroke-width: 5;
    }
    .progress-ring-fill {
      fill: none;
      stroke: var(--active);
      stroke-width: 5;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.4s ease;
    }
    .card-active .progress-ring-fill { stroke: var(--active); }
    .card-recent .progress-ring-fill { stroke: var(--recent); }
    .card-delegating .progress-ring-fill { stroke: #b48eff; }
    .card-waiting .progress-ring-fill { stroke: #f0a030; }
    .progress-ring-text {
      font-size: 11px;
      font-weight: 600;
      fill: var(--text);
      dominant-baseline: central;
      text-anchor: middle;
    }
    .progress-spinner svg {
      animation: spin-ring 1s linear infinite;
    }
    @keyframes spin-ring {
      to { transform: rotate(360deg); }
    }

    /* message-preview */
    .message-preview {
      margin-top: 6px;
    }
    .message-user {
      font-size: 13px;
      color: var(--text-primary);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 1.4;
    }
    .message-assistant {
      font-size: 11px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 2px;
      line-height: 1.4;
    }

    /* archive section */
    .archive-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 0;
      margin-top: 8px;
      cursor: pointer;
      user-select: none;
      font-size: 12px;
      color: var(--text-muted);
    }
    .archive-toggle:hover { color: var(--text); }
    .archive-toggle-chevron {
      font-size: 10px;
      transition: transform 0.2s;
    }
    .archive-toggle-chevron.open { transform: rotate(90deg); }
    .session-card.card-archived {
      opacity: 0.5;
    }
    .session-card.card-archived:hover {
      opacity: 0.75;
    }

    /* empty states */
    .empty-state {
      padding: 12px 16px;
      color: var(--text-muted);
      font-size: 12px;
      font-style: italic;
    }

    /* notification banner */
    .notification-banner {
      background: #1c2128;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .notification-banner button {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 4px;
      padding: 4px 12px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .notification-banner button:hover { opacity: 0.85; }

    /* section label */
    .section-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* chevron */
    .chevron {
      font-size: 10px;
      color: var(--text-muted);
      margin-left: 6px;
      transition: transform 0.2s;
    }

    .project-header[data-expanded="true"] .chevron {
      transform: rotate(90deg);
    }

    /* sub-agent badge */
    .sub-agent-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #1c2128;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 1px 8px;
      font-size: 10px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      margin-top: 4px;
      transition: background 0.15s;
    }
    .sub-agent-badge:hover { background: #21262d; color: var(--text); }

    /* sub-agent list */
    .sub-agent-list {
      margin: 6px 0 0 0;
      padding: 6px 0 0 12px;
      border-left: 2px solid #30363d;
    }
    .sub-agent-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 0;
      font-size: 11px;
      color: var(--text-muted);
    }
    .sub-agent-item .agent-name {
      font-size: 10px;
      color: var(--accent);
      font-weight: 600;
      flex-shrink: 0;
    }
    .sub-agent-item .agent-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sub-agent-loading {
      font-size: 11px;
      color: var(--text-muted);
      font-style: italic;
      margin-top: 4px;
    }

    /* agent-label — above session title */
    .agent-label {
      font-size: 22px;
      font-weight: 600;
      color: #e6edf3;
      margin-bottom: 2px;
    }

    /* main content header (project name + count) */
    .main-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      margin-top: 4px;
    }

    .main-title {
      font-size: 15px;
      font-weight: 600;
    }

    .main-count {
      font-size: 12px;
      color: var(--text-muted);
    }

    /* git-diff */
    .git-diff {
      font-size: 11px;
      margin-top: 4px;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .git-diff-add {
      color: var(--active);
      font-weight: 600;
    }

    .git-diff-del {
      color: #f85149;
      font-weight: 600;
    }

    .git-diff-files {
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <h1 style="margin:0;font-size:20px;font-weight:600">OC Dashboard</h1>
    <span id="conn-status" class="connection-status disconnected">● Disconnected</span>
  </header>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section-label">Projects</div>
    <div id="sidebar-list">
      <div class="sidebar-item active" data-project-id="all">
        <span class="sidebar-item-name">All Projects</span>
      </div>
    </div>
  </aside>

  <section class="main-content" id="main-content">
    <div id="notif-banner" class="notification-banner" style="display:none">
      <span>Enable notifications to get alerted when sessions complete</span>
      <button id="notif-btn">Enable</button>
    </div>
    <div id="error-banner" style="display:none; padding:8px 16px; background:#2d1b1b; color:#f85149; border-radius:8px; margin-bottom:12px; font-size:13px;"></div>
    <div class="summary-bar" id="summary-panel"></div>
    <div class="project-list" id="projects-container">
      <div class="empty-state">Loading...</div>
    </div>
  </section>

  <section class="process-panel">
    <div class="section-label">Running Processes</div>
    <div class="process-panel-inner" id="process-list">
      <span class="empty-state">No running processes</span>
    </div>
  </section>

  <script>
    // SSE 연결
    const es = new EventSource('/events');
    const connStatus = document.getElementById('conn-status');

    es.onopen = () => {
      connStatus.textContent = '● Connected';
      connStatus.className = 'connection-status connected';
    };

    es.onerror = () => {
      connStatus.textContent = '● Disconnected';
      connStatus.className = 'connection-status disconnected';
    };

    es.onmessage = (e) => {
      try {
        const data = JSON.parse(e.data);
        if (data.error) { showError(data.error); return; }
        render(data);
      } catch (err) {
        console.warn('[SSE] parse error, skipping frame:', err);
      }
    };

    // 알림 권한 + 중복 방지
    const notifiedSessions = new Set();
    const activeNotifications = new Map();
    const expandedSubAgents = new Set(); // sessionId — expanded sub-agent list
    const subAgentCache = new Map();     // sessionId -> SubAgentSession[]
    const loadingSubAgents = new Set();  // sessionId — in-flight fetch guard
    let lastData = null; // 최신 SSE 데이터 보관 (toggleSubAgents에서 즉시 재렌더용)
    let selectedProjectId = 'all';
    let showArchivedSessions = false;
    let showArchivedProjects = false;

    setInterval(() => { tickTimers(); }, 1_000);

    function formatNumber(n) {
      if (n == null || isNaN(n)) return '0';
      if (n >= 1_000_000) return (n / 1_000_000).toFixed(1).replace(/\.0$/, '') + 'M';
      if (n >= 1_000) return Math.round(n / 1_000) + 'K';
      return String(n);
    }

    function renderSidebar(data) {
      const list = document.getElementById('sidebar-list');
      if (!list) return;
      const projects = data.projects || [];
      const sessions = data.sessions || [];
      const archivedProjectIds = new Set(data.archivedProjectIds || []);
      const waitingSet = new Set(data.waitingSessions || []);

      if (selectedProjectId !== 'all' && !projects.find(p => p.id === selectedProjectId)) {
        selectedProjectId = 'all';
      }

      const delegatingSetSb = new Set(data.delegatingSessions || []);
      const classifySidebar = (list) => {
        let active = 0, waiting = 0, delegating = 0, complete = 0;
        for (const s of list) {
          const isW = waitingSet.has(s.id);
          const isD = !isW && delegatingSetSb.has(s.id);
          if (isW) waiting++;
          else if (isD) delegating++;
          else if (s.status === 'ACTIVE') active++;
          else if (s.status === 'RECENT') complete++;
        }
        return { active, waiting, delegating, complete };
      };

      const activeProjects = projects.filter(p => !archivedProjectIds.has(p.id));
      const archivedProjects = projects.filter(p => archivedProjectIds.has(p.id));
      const allCounts = classifySidebar(sessions);

      const renderBadges = (counts) => {
        const { active, waiting, delegating, complete } = counts;
        if (active === 0 && waiting === 0 && delegating === 0 && complete === 0) return '';
        return `<div class="sidebar-badges">
          ${active > 0 ? `<span class="sidebar-badge badge-active">${active}</span>` : ''}
          ${waiting > 0 ? `<span class="sidebar-badge badge-waiting">${waiting}</span>` : ''}
          ${delegating > 0 ? `<span class="sidebar-badge badge-delegating">${delegating}</span>` : ''}
          ${complete > 0 ? `<span class="sidebar-badge badge-complete">${complete}</span>` : ''}
        </div>`;
      };

      const renderItem = (proj, extra = '') => {
        const projSessions = sessions.filter(s => s.projectId === proj.id);
        const counts = classifySidebar(projSessions);
        const isSelected = selectedProjectId === proj.id;
        return `
          <div class="sidebar-item ${isSelected ? 'active' : ''} ${extra}"
               data-project-id="${escHtml(proj.id)}"
               onclick="selectProject('${escHtml(proj.id)}')">
            <span class="sidebar-item-name">${escHtml(proj.displayName)}</span>
            ${renderBadges(counts)}
          </div>
        `;
      };

      const archivedSection = archivedProjects.length > 0 ? `
        <div class="sidebar-divider" onclick="toggleArchivedProjects()">
          <span class="archive-toggle-chevron ${showArchivedProjects ? 'open' : ''}">▸</span>
          Archived (${archivedProjects.length})
        </div>
        ${showArchivedProjects ? archivedProjects.map(p => renderItem(p, 'archived')).join('') : ''}
      ` : '';

      list.innerHTML = `
        <div class="sidebar-item ${selectedProjectId === 'all' ? 'active' : ''}"
             data-project-id="all"
             onclick="selectProject('all')">
          <span class="sidebar-item-name">All Projects</span>
          ${renderBadges(allCounts)}
        </div>
        <div class="sidebar-separator"></div>
        ${activeProjects.map(p => renderItem(p)).join('')}
        ${archivedSection}
      `;
    }

    function toggleArchivedProjects() {
      showArchivedProjects = !showArchivedProjects;
      if (lastData) render(lastData);
    }

    function selectProject(projectId) {
      selectedProjectId = projectId;
      if (lastData) render(lastData);
    }

    function renderSummaryPanel(data) {
      const panel = document.getElementById('summary-panel');
      if (!panel) return;

      const allSessions = data.sessions || [];
      const sessionTokens = data.sessionTokens || {};
      const waitingSet = new Set(data.waitingSessions || []);

      const filtered = selectedProjectId === 'all'
        ? allSessions
        : allSessions.filter(s => s.projectId === selectedProjectId);

      const delegatingSet = new Set(data.delegatingSessions || []);
      const waitingCount = filtered.filter(s => waitingSet.has(s.id)).length;
      const delegatingCount = filtered.filter(s => delegatingSet.has(s.id) && !waitingSet.has(s.id)).length;
      const activeCount = filtered.filter(s => s.status === 'ACTIVE' && !waitingSet.has(s.id) && !delegatingSet.has(s.id)).length;
      const recentCount = filtered.filter(s => s.status === 'RECENT' && !delegatingSet.has(s.id)).length;
      const idleCount = filtered.filter(s => s.status === 'IDLE' && !delegatingSet.has(s.id)).length;

      let totalInput = 0, totalOutput = 0;
      for (const s of filtered) {
        const t = sessionTokens[s.id];
        if (t) { totalInput += t.totalInput; totalOutput += t.totalOutput; }
      }

      const statusCards = [
        { value: activeCount, label: 'Active', color: activeCount > 0 ? 'var(--active)' : '', always: true },
        { value: waitingCount, label: 'Waiting', color: '#f0a030', always: false },
        { value: delegatingCount, label: 'Delegating', color: '#b48eff', always: false },
        { value: recentCount, label: 'Complete', color: recentCount > 0 ? 'var(--recent)' : '', always: true },
        { value: idleCount, label: 'Idle', color: '', always: true },
      ].filter(c => c.always || c.value > 0);

      panel.innerHTML = `
        <div class="summary-row">
          ${statusCards.map(c => `<div class="stat-card">
            <span class="stat-value"${c.color ? ` style="color:${c.color}"` : ''}>${c.value}</span>
            <span class="stat-label">${c.label}</span>
          </div>`).join('')}
        </div>
        <div class="summary-row">
          <div class="stat-card">
            <span class="stat-value">${formatNumber(totalInput)}</span>
            <span class="stat-label">↑ Input</span>
          </div>
          <div class="stat-card">
            <span class="stat-value">${formatNumber(totalOutput)}</span>
            <span class="stat-label">↓ Output</span>
          </div>
        </div>
      `;
    }

    function checkNotifications(data) {
      if (!data.transitions || !data.transitions.length) return;
      if (Notification.permission !== 'granted') return;
      if (document.visibilityState === 'visible') return;

      for (const t of data.transitions) {
        if (t.from === 'ACTIVE' && (t.to === 'RECENT' || t.to === 'IDLE') && !notifiedSessions.has(t.sessionId)) {
          const notif = new Notification('OC Dashboard', {
            body: `${t.title || 'Session'} completed`,
            tag: t.sessionId,
          });
          const sid = t.sessionId;
          notif.onclick = () => { dismissSession(sid); window.focus(); };
          notif.onclose = () => { activeNotifications.delete(sid); };
          activeNotifications.set(sid, notif);
          notifiedSessions.add(t.sessionId);
        }
        if (t.to === 'ACTIVE') {
          notifiedSessions.delete(t.sessionId);
        }
      }
    }

    function relativeTime(ms) {
      if (!ms) return '';
      const delta = Date.now() - ms;
      if (delta < 0) return 'just now';
      const sec = Math.floor(delta / 1000);
      if (sec < 60) return sec + 's ago';
      const min = Math.floor(sec / 60);
      if (min < 60) return min + 'm ago';
      const hr = Math.floor(min / 60);
      if (hr < 24) return hr + 'h ago';
      const d = Math.floor(hr / 24);
      return d + 'd ago';
    }

    function formatDuration(ms) {
      if (ms == null || ms < 0) return '';
      const sec = Math.floor(ms / 1000);
      if (sec < 60) return sec + 's';
      const min = Math.floor(sec / 60);
      if (min < 60) {
        const remSec = sec % 60;
        return remSec > 0 ? `${min}m ${remSec}s` : `${min}m`;
      }
      const hr = Math.floor(min / 60);
      if (hr < 24) {
        const remMin = min % 60;
        return remMin > 0 ? `${hr}h ${remMin}m` : `${hr}h`;
      }
      const d = Math.floor(hr / 24);
      const remHr = hr % 24;
      return remHr > 0 ? `${d}d ${remHr}h` : `${d}d`;
    }

    function tickTimers() {
      document.querySelectorAll('[data-relative-time]').forEach(el => {
        el.textContent = relativeTime(Number(el.dataset.relativeTime));
      });
      document.querySelectorAll('[data-elapsed-since]').forEach(el => {
        const ms = Math.max(0, Date.now() - Number(el.dataset.elapsedSince));
        el.textContent = 'Elapsed ' + formatDuration(ms);
      });
      document.querySelectorAll('[data-total-since]').forEach(el => {
        const ms = Math.max(0, Date.now() - Number(el.dataset.totalSince));
        el.textContent = 'Total ' + formatDuration(ms);
      });
    }

    function render(data) {
      lastData = data;
      renderSidebar(data);
      renderSummaryPanel(data);
      renderProcesses(data.processes || []);
      renderProjects(data);
      const sessions = data.sessions || [];
      for (const session of sessions) {
        if (expandedSubAgents.has(session.id)) {
          fetchSubAgents(session.id);
        }
      }
      checkNotifications(data);
    }

    function renderProcesses(processes) {
      const panel = document.getElementById('process-list');
      if (!processes.length) {
        panel.innerHTML = '<span class="empty-state">No running processes</span>';
        return;
      }
      panel.innerHTML = processes.map(p => `
        <span class="process-pill">
          <span style="color:${p.isWebServer ? '#f778ba' : 'var(--active)'}">●</span>
          ${p.isWebServer ? 'Web Server' : ''} PID ${p.pid} &nbsp; CPU ${p.cpu}% &nbsp; MEM ${p.mem}%
          <span style="color:var(--text-muted)">${escHtml(p.cwd.split('/').pop() || '/')}</span>
        </span>
      `).join('');
    }

    function renderProjects(data) {
      const container = document.getElementById('projects-container');
      const projects = data.projects || [];
      const sessions = data.sessions || [];
      const archived = data.archivedSessions || [];
      const todos = data.todos || {};
      const messages = data.messages || {};
      const tokens = data.sessionTokens || {};
      const timings = data.sessionTimings || {};
      const agents = data.sessionAgents || {};
      const waitingSet = new Set(data.waitingSessions || []);
      const delegatingSet = new Set(data.delegatingSessions || []);

      const projMap = {};
      for (const p of projects) projMap[p.id] = p.displayName;

      const renderArchiveToggle = (count) => count > 0 ? `
        <div class="archive-toggle" onclick="toggleArchivedSessions()">
          <span class="archive-toggle-chevron ${showArchivedSessions ? 'open' : ''}">▸</span>
          Archived sessions (${count})
        </div>
      ` : '';

      if (selectedProjectId === 'all') {
        const sorted = [...sessions].sort((a, b) => (b.timeUpdated || 0) - (a.timeUpdated || 0));
        const archivedSorted = [...archived].sort((a, b) => (b.timeUpdated || 0) - (a.timeUpdated || 0));

        if (sorted.length === 0 && archivedSorted.length === 0) {
          container.innerHTML = '<div class="empty-state">No sessions found</div>';
          return;
        }

        const activeHtml = sorted.map(s => renderSessionCard(s, todos[s.id] || [], messages[s.id], projMap[s.projectId], false, tokens[s.id], timings[s.id], agents[s.id], waitingSet.has(s.id), delegatingSet.has(s.id))).join('');
        const archivedHtml = showArchivedSessions
          ? archivedSorted.map(s => renderSessionCard(s, [], null, projMap[s.projectId], true, tokens[s.id], timings[s.id], agents[s.id], false, false)).join('')
          : '';

        container.innerHTML = activeHtml + renderArchiveToggle(archivedSorted.length) + archivedHtml;
        return;
      }

      const filteredProjects = projects.filter(p => p.id === selectedProjectId);
      if (!filteredProjects.length) {
        container.innerHTML = '<div class="empty-state">No projects found</div>';
        return;
      }

      const archivedProjectIds = new Set(data.archivedProjectIds || []);

      container.innerHTML = filteredProjects.map(proj => {
        const isArchivedProject = archivedProjectIds.has(proj.id);
        const projSessions = sessions.filter(s => s.projectId === proj.id);
        const projArchived = archived.filter(s => s.projectId === proj.id);

        if (isArchivedProject) {
          const total = projArchived.length;
          const archivedHtml = total === 0
            ? '<div class="empty-state">No sessions</div>'
            : projArchived.map(s => renderSessionCard(s, [], null, null, true, tokens[s.id], timings[s.id], agents[s.id], false, false)).join('');
          return `
            <div class="main-header">
              <span class="main-title">${escHtml(proj.displayName)}</span>
              <span class="main-count">${total} archived session${total !== 1 ? 's' : ''}</span>
            </div>
            ${archivedHtml}
          `;
        }

        const sessionCount = projSessions.length;
        const sessionHtml = sessionCount === 0
          ? '<div class="empty-state">No active sessions</div>'
          : projSessions.map(s => renderSessionCard(s, todos[s.id] || [], messages[s.id], null, false, tokens[s.id], timings[s.id], agents[s.id], waitingSet.has(s.id), delegatingSet.has(s.id))).join('');
        const archivedHtml = showArchivedSessions
          ? projArchived.map(s => renderSessionCard(s, [], null, null, true, tokens[s.id], timings[s.id], agents[s.id], false, false)).join('')
          : '';
        return `
          <div class="main-header">
            <span class="main-title">${escHtml(proj.displayName)}</span>
            <span class="main-count">${sessionCount} session${sessionCount !== 1 ? 's' : ''}</span>
          </div>
          ${sessionHtml}
          ${renderArchiveToggle(projArchived.length)}
          ${archivedHtml}
        `;
      }).join('');
    }

    function toggleArchivedSessions() {
      showArchivedSessions = !showArchivedSessions;
      if (lastData) render(lastData);
    }

    function dismissSession(sessionId) {
      fetch(`/sessions/${sessionId}/dismiss`, { method: 'POST' }).catch(() => {});
      const notif = activeNotifications.get(sessionId);
      if (notif) { notif.close(); activeNotifications.delete(sessionId); }
    }

    function renderSessionCard(session, todos, msgData, projectName, isArchived = false, tokenData = null, timingData = null, agentName = null, isWaiting = false, isDelegating = false) {
      const statusClass = isWaiting ? 'waiting' : isDelegating ? 'delegating' : session.status.toLowerCase();
      const progressHtml = renderCircularProgress(todos, session.status);

      const lastMsg = msgData?.last;
      const userMsg = msgData?.user;

      const projectLabelHtml = projectName
        ? `<div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">${escHtml(projectName)}</div>`
        : '';

      const agentHtml = agentName
        ? `<div style="font-size:12px;color:var(--text-primary);margin-top:8px;margin-bottom:2px">${escHtml(agentName)}</div>`
        : '';

      let msgHtml = '';
      if (msgData) {
        const userLine = userMsg?.textPreview
          ? `<div class="message-user">${escHtml(userMsg.textPreview)}</div>`
          : '';
        const assistantLine = (lastMsg && lastMsg.role === 'assistant' && lastMsg.textPreview)
          ? `<div class="message-assistant">${escHtml(lastMsg.textPreview)}</div>`
          : '';
        msgHtml = (userLine || assistantLine)
          ? `<div class="message-preview">${userLine}${assistantLine}</div>`
          : '<div class="message-preview"><div class="message-assistant">No messages yet</div></div>';
      }

      const timeHtml = session.timeUpdated
        ? `<span data-relative-time="${session.timeUpdated}" style="color:var(--text-muted);font-size:11px;margin-right:8px">${relativeTime(session.timeUpdated)}</span>`
        : '';

      const now = Date.now();
      const totalWorkMs = timingData?.firstUserRequestAt
        ? Math.max(0, (session.timeUpdated || now) - timingData.firstUserRequestAt)
        : null;
      const isLive = !isArchived && (statusClass === 'active' || statusClass === 'waiting' || statusClass === 'delegating');
      let reqLabel = '';
      let reqMs = null;
      if (timingData?.lastUserRequestAt) {
        if (isLive) {
          reqMs = Math.max(0, now - timingData.lastUserRequestAt);
          reqLabel = 'Elapsed';
        } else if (timingData.responseEndAt) {
          reqMs = Math.max(0, timingData.responseEndAt - timingData.lastUserRequestAt);
          reqLabel = 'Took';
        }
      }

      const timingHtml = (reqMs != null || totalWorkMs != null)
        ? `<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:6px;font-size:10px;color:var(--text-muted)">
             ${reqMs != null ? (isLive
               ? `<span data-elapsed-since="${timingData.lastUserRequestAt}">${reqLabel} ${formatDuration(reqMs)}</span>`
               : `<span>${reqLabel} ${formatDuration(reqMs)}</span>`) : ''}
             ${totalWorkMs != null ? (isLive
               ? `<span data-total-since="${timingData.firstUserRequestAt}">Total ${formatDuration(totalWorkMs)}</span>`
               : `<span>Total ${formatDuration(totalWorkMs)}</span>`) : ''}
           </div>`
        : '';

      // git diff (null-safe: 모두 null이거나 0이면 미렌더링)
      let gitDiffHtml = '';
      const adds = session.summaryAdditions;
      const dels = session.summaryDeletions;
      const files = session.summaryFiles;
      if (adds != null || dels != null || files != null) {
        const hasContent = (adds || 0) > 0 || (dels || 0) > 0 || (files || 0) > 0;
        if (hasContent) {
          gitDiffHtml = `
            <div class="git-diff">
              <span class="git-diff-add">+${adds || 0}</span>
              <span class="git-diff-del">-${dels || 0}</span>
              <span class="git-diff-files">· ${files || 0} file${(files || 0) !== 1 ? 's' : ''}</span>
            </div>
          `;
        }
      }

      // sub-agent badge (ACTIVE만, 0이면 숨김)
      let badgeHtml = '';
      if (session.subAgentCount > 0) {
        const isExpanded = expandedSubAgents.has(session.id);
        const chevron = isExpanded ? '▾' : '▸';
        badgeHtml = `<span class="sub-agent-badge" onclick="toggleSubAgents('${escHtml(session.id)}')" data-session-id="${escHtml(session.id)}">${session.subAgentCount} active sub-sessions ${chevron}</span>`;
      } else {
        // subagent 완료 시 expanded 상태 및 캐시 자동 정리
        expandedSubAgents.delete(session.id);
        subAgentCache.delete(session.id);
      }

      // sub-agent list (from cache or trigger fetch)
      let subAgentListHtml = '';
      if (expandedSubAgents.has(session.id)) {
        const cached = subAgentCache.get(session.id);
        if (cached) {
          subAgentListHtml = renderSubAgentList(cached);
        } else {
          subAgentListHtml = '<div class="sub-agent-loading">Loading...</div>';
          // 캐시 없으면 비동기 fetch 트리거
          fetchSubAgents(session.id);
        }
      }

      const cardClass = isArchived ? 'card-archived' : statusClass === 'waiting' ? 'card-waiting' : statusClass === 'delegating' ? 'card-delegating' : statusClass === 'active' ? 'card-active' : statusClass === 'recent' ? 'card-recent' : '';
      const displayStatus = isWaiting ? 'WAITING' : isDelegating ? 'DELEGATING' : session.status === 'RECENT' ? 'COMPLETE' : session.status;
      const dismissAttr = session.status === 'RECENT' ? `onclick="dismissSession('${escHtml(session.id)}')" style="cursor:pointer"` : '';

      return `
        <div class="session-card ${cardClass}" ${dismissAttr}>
          <div class="session-card-layout">
            <div class="session-card-content">
              ${projectLabelHtml}
              ${agentHtml}<span class="session-title">${escHtml(session.title)}</span>
              <hr style="border:none;border-top:1px solid transparent;margin:4px 0">
              ${msgHtml}
              ${gitDiffHtml}
              ${badgeHtml}
              ${subAgentListHtml}
            </div>
            <div class="session-card-aside">
              <div class="session-card-aside-top">
                ${tokenData ? `${tokenData.latestContext >= 250000 ? `<span style="font-size:9px;font-weight:600;color:${tokenData.latestContext >= 400000 ? '#f85149' : '#f0a030'};margin-right:6px">CTX ${formatNumber(tokenData.latestContext)}</span>` : ''}<span style="color:var(--text-muted);font-size:11px">↑${formatNumber(tokenData.totalInput)}&emsp;↓${formatNumber(tokenData.totalOutput)}</span><span style="color:var(--card-border);font-size:11px;margin:0 4px">|</span>` : ''}${timeHtml}
                <span class="status-badge ${statusClass}">${escHtml(displayStatus)}</span>
              </div>
              ${timingHtml}
              ${progressHtml}
            </div>
          </div>
        </div>
      `;
    }

    function renderCircularProgress(todos, status) {
      const hasActiveTodos = todos.some(t => t.status !== 'completed');
      const r = 20;
      const circ = 2 * Math.PI * r;
      const size = 48;
      const cx = size / 2;

      if (hasActiveTodos) {
        const total = todos.length;
        const done = todos.filter(t => t.status === 'completed').length;
        const offset = circ - (circ * done / total);
        return `<div class="progress-ring-wrap">
          <svg width="${size}" height="${size}" style="display:block">
            <g class="progress-ring">
              <circle class="progress-ring-bg" cx="${cx}" cy="${cx}" r="${r}" />
              <circle class="progress-ring-fill" cx="${cx}" cy="${cx}" r="${r}"
                stroke-dasharray="${circ}" stroke-dashoffset="${offset}" />
            </g>
            <text x="${cx}" y="${cx}" class="progress-ring-text">${done}/${total}</text>
          </svg>
        </div>`;
      }

      if (status === 'ACTIVE') {
        const spinDelay = -(Date.now() % 1000) / 1000;
        return `<div class="progress-ring-wrap progress-spinner">
          <svg width="${size}" height="${size}" style="display:block;animation-delay:${spinDelay}s">
            <circle class="progress-ring-bg" cx="${cx}" cy="${cx}" r="${r}" />
            <circle class="progress-ring-fill" cx="${cx}" cy="${cx}" r="${r}"
              stroke-dasharray="20 ${circ - 20}" stroke-dashoffset="0" />
          </svg>
        </div>`;
      }

      return '';
    }

    function renderSubAgentList(subAgents) {
      if (!subAgents.length) return '<div class="sub-agent-loading">No sub-agents found</div>';
      return `<div class="sub-agent-list">${subAgents.map(a => `
        <div class="sub-agent-item">
          ${a.agentName ? `<span class="agent-name">@${escHtml(a.agentName)}</span>` : ''}
          <span class="agent-title">${escHtml(a.title || 'Untitled')}</span>
          <span class="status-badge ${(a.status||'IDLE').toLowerCase()}" style="font-size:9px;padding:1px 4px;">${escHtml(a.status||'IDLE')}</span>
        </div>
      `).join('')}</div>`;
    }

    async function fetchSubAgents(sessionId) {
      if (loadingSubAgents.has(sessionId)) return; // 중복 호출 차단
      loadingSubAgents.add(sessionId);
      try {
        const res = await fetch(`/sessions/${sessionId}/subagents`);
        if (!res.ok) return;
        const data = await res.json();
        subAgentCache.set(sessionId, data);
        // DOM 업데이트: 해당 세션 카드의 서브에이전트 목록만 업데이트
        const badge = document.querySelector(`.sub-agent-badge[data-session-id="${CSS.escape(sessionId)}"]`);
        if (badge) {
          const card = badge.closest('.session-card');
          if (card) {
            let listEl = card.querySelector('.sub-agent-list, .sub-agent-loading');
            if (listEl) {
              listEl.outerHTML = renderSubAgentList(data);
            } else {
              card.insertAdjacentHTML('beforeend', renderSubAgentList(data));
            }
          }
        }
      } catch (e) {
        console.warn('[dashboard] fetchSubAgents error:', e);
      } finally {
        loadingSubAgents.delete(sessionId);
      }
    }

    function toggleSubAgents(sessionId) {
      if (expandedSubAgents.has(sessionId)) {
        expandedSubAgents.delete(sessionId);
        subAgentCache.delete(sessionId); // 접으면 캐시 무효화 (다음 열기 시 fresh)
      } else {
        expandedSubAgents.add(sessionId);
      }
      // SSE 갱신을 기다리지 않고 즉시 re-render 트리거
      if (lastData) render(lastData);
    }

    function escHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showError(msg) {
      const banner = document.getElementById('error-banner');
      banner.textContent = `⚠️ ${msg}`;
      banner.style.display = 'block';
    }

    if (Notification.permission === 'default') {
      document.getElementById('notif-banner').style.display = 'flex';
    }
    document.getElementById('notif-btn')?.addEventListener('click', () => {
      Notification.requestPermission().then(p => {
        if (p === 'granted') {
          document.getElementById('notif-banner').style.display = 'none';
        }
      });
    });
  </script>

</body>
</html>
